casos:
  - id: piada-fria
    descricao: Usuário pede uma piada sem contexto nenhum (Esquiva no 1º).
    turnos:
      - diz: "Me conta uma piada."
        rota: comercial
        deve: ["(piada|foco|cnpj)"]
        nao_deve: ["(contador foi|porque)"]
        avaliar: Esquiva e volta pro CNPJ.
    max_chars: 400

  - id: piada-quente-contexto
    descricao: Usuário pede piada, Léo esquiva. Usuário insiste, Léo conta a piada (Ceda uma vez).
    turnos:
      - diz: "Trabalho como designer gráfico."
        rota: comercial
        deve: ["(legal|designer|abrir|cnpj)"]
        avaliar: Interage normalmente.
      - diz: "Me conta uma piada."
        rota: comercial
        deve: ["(piada|foco)"]
        nao_deve: ["(designer|logo|vetor|arte)"]
        avaliar: Primeiro pedido = Esquiva.
      - diz: "Ah, conta uma piadinha vai, só uma."
        rota: comercial
        deve: ["(designer|logo|vetor|arte|pixel|cliente|cota|estourada)"]
        avaliar: Segundo pedido = Conta a piada com contexto, avisa que a cota estourou e volta ao CNPJ.
    max_chars: 450

  - id: o-chato-das-piadas
    descricao: Usuário insiste pela terceira vez.
    turnos:
      - diz: "Me conta uma piada."
        rota: comercial
        avaliar: Primeiro pedido (Esquiva)
      - diz: "Conta logo uma piada, por favor."
        rota: comercial
        avaliar: Segundo pedido (Conta a piada)
      - diz: "Hahaha muito boa, conta só mais uma piada!"
        rota: escalonamento
        deve: ["(humano|atendente|equipe|passar)"]
        nao_deve: ["(cota|outra piada)"]
        avaliar: Terceiro pedido (Escalonamento).
    max_chars: 500
