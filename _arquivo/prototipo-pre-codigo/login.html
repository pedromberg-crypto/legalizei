        <div class="shrink-0 bg-ink-50 rounded-t-[30px] -mt-5 px-7 pt-8 pb-7 flex flex-col">

          <!-- E-mail -->
          <label class="field flex items-center gap-3 rounded-[15px] bg-white border border-ink-200 px-4 h-[56px]">
            <svg class="fi text-ink-400" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            <input type="email" inputmode="email" autocomplete="email" placeholder="E-mail" class="flex-1 bg-transparent outline-none text-[15px] text-ink-900">
          </label>

          <!-- Senha -->
          <label class="field flex items-center gap-3 rounded-[15px] bg-white border border-ink-200 px-4 h-[56px] mt-3.5">
            <svg class="fi text-ink-400" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input id="pwd" type="password" autocomplete="current-password" placeholder="Senha" class="flex-1 bg-transparent outline-none text-[15px] text-ink-900">
            <button id="togglePwd" type="button" class="text-ink-400 hover:text-ink-600 shrink-0" aria-label="Mostrar senha">
              <svg id="eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </label>

          <!-- Lembrar / Esqueci -->
          <div class="flex items-center justify-between mt-4">
            <label class="flex items-center gap-2 cursor-pointer select-none">
              <input type="checkbox" class="peer sr-only">
              <span class="w-[18px] h-[18px] rounded-[6px] border border-ink-300 peer-checked:bg-coral-500 peer-checked:border-coral-500 grid place-items-center transition-colors">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>
              </span>
              <span class="text-[13.5px] text-ink-500">Lembrar de mim</span>
            </label>
            <a href="#" class="text-[13.5px] text-coral-700 font-600">Esqueci a senha</a>
          </div>

          <!-- Entrar -->
          <button type="button" onclick="location.href='fase-0-dados-socio.html'" class="btn w-full rounded-[16px] py-4 mt-6 bg-coral-500 text-white text-[16px] font-700 shadow-[0_10px_26px_rgba(242,100,60,.30)]">
            Entrar
          </button>

          <!-- Divisor -->
          <div class="flex items-center gap-3 my-6">
            <span class="h-px flex-1 bg-ink-200"></span>
            <span class="text-[12.5px] text-ink-400">ou entre com</span>
            <span class="h-px flex-1 bg-ink-200"></span>
          </div>

          <!-- Social -->
          <div class="grid grid-cols-2 gap-3">
            <button class="social flex items-center justify-center gap-2.5 rounded-[15px] bg-white border border-ink-200 h-[54px] text-[14.5px] font-600 text-ink-800">

              Apple
            </button>
          </div>

          <!-- Criar conta (cadastro nasce no fork/welcome) -->
          <p class="text-center text-[13.5px] text-ink-400 pt-6">
            Ainda não tem conta? <a href="fluxo-entrada.html" class="text-coral-700 font-600">Criar conta</a>
          </p>

        </div>

  <script>
    // mostrar/ocultar senha
    const pwd = document.getElementById('pwd');
    const eye = document.getElementById('eye');
    document.getElementById('togglePwd').addEventListener('click', () => {
      const show = pwd.type === 'password';
      pwd.type = show ? 'text' : 'password';
      eye.innerHTML = show
        ? '<path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.5 13.5 0 0 0 2 12s3 7 10 7a9.7 9.7 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/>'
        : '<path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0z"/><circle cx="12" cy="12" r="3"/>';
    });
  </script>
