casos:
  - id: cnae-mascara
    descricao: Cliente manda o número do CNAE completo com máscara.
    turnos:
      - diz: "Oi, eu quero abrir empresa com o CNAE 7311-4/00."
        rota: comercial
        deve: ["(publicidade|ag[êe]ncia)"]
        avaliar: Reconhece a atividade de publicidade/agência.
    max_chars: 400

  - id: cnae-apenas-numeros
    descricao: Cliente manda apenas os dígitos numéricos.
    turnos:
      - diz: "Vocês atendem o código 7420001?"
        rota: comercial
        deve: ["(fotografia|fot[óo]grafo)"]
        avaliar: Entende que é fotografia mesmo sem a formatação.
    max_chars: 400

  - id: cnae-inexistente
    descricao: Cliente manda um CNAE totalmente inventado.
    turnos:
      - diz: "Meu CNAE é 9999-9/99, atendem?"
        rota: comercial
        deve: ["(n[ãa]o (encontrei|achei)|d[úu]vida|n[ãa]o existe)"]
        avaliar: Informa que não encontrou o código e pergunta a atividade em texto.
    max_chars: 400

  - id: cnae-texto-direto
    descricao: Cliente diz a profissão, sem citar número.
    turnos:
      - diz: "Eu trabalho como psicólogo, quero abrir o CNPJ."
        rota: comercial
        deve: ["(psic[óo]logo|psicologia)"]
        avaliar: Confirma que atende a atividade.
    max_chars: 400

  - id: cnae-ambiguo
    descricao: Cliente diz uma área genérica (Design), Léo deve mostrar opções e pedir contexto.
    turnos:
      - diz: "Trabalho com design e quero abrir."
        rota: comercial
        deve: ["(gr[áa]fico|interiores|web|qual|dia a dia|tipo de)"]
        nao_deve: ["(seu cnae [ée])"]
        avaliar: Mostra as opções de design que atendemos e pede pro cliente especificar o dia a dia.
    max_chars: 500

  - id: cnae-fora-texto
    descricao: Cliente manda atividade fora de escopo (ex médico) em texto.
    turnos:
      - diz: "Sou médico cirurgião."
        rota: fora_escopo
        deve: ["(m[ée]dico|cirurgia|n[ãa]o atende)"]
        avaliar: Reconhece a área mas avisa de forma curta que não atende.
    max_chars: 450

  - id: cnae-fora-numero
    descricao: Cliente manda CNAE fora de escopo.
    turnos:
      - diz: "Meu CNAE é 8630-5/03"
        rota: fora_escopo
        deve: ["(m[ée]dic|n[ãa]o atende)"]
        avaliar: Identifica a atividade médica pelo código e avisa que não atende.
    max_chars: 450

  - id: cnae-misto
    descricao: Atividade atendida e não atendida juntas.
    turnos:
      - diz: "Quero abrir pra fotografia e consulta médica."
        rota: fora_escopo
        deve: ["(fotografia|m[ée]dic)"]
        avaliar: Identifica as duas, mas barra a abertura por causa da medicina.
    max_chars: 500

  - id: cnae-nao-mei
    descricao: Profissão permitida na Legalizai, mas que historicamente gera dúvidas sobre MEI.
    turnos:
      - diz: "Sou programador, CNAE 6201-5/01."
        rota: comercial
        deve: ["(programa|software)"]
        avaliar: Atende e orienta sobre ME/faturamento.
    max_chars: 450

  - id: cnae-incompleto
    descricao: Cliente digita apenas o começo/grupo do CNAE.
    turnos:
      - diz: "Meu CNAE começa com 7311"
        rota: comercial
        deve: ["(publicidade|ag[êe]ncia)"]
        avaliar: Puxa a família de publicidade/agência.
    max_chars: 450

# ══════════════════════════════════════════════════════════════════════
#  25/09 · os 5 casos do pacote que corrigiu a documentação do CNAE.
#
#  Cada um nasce de uma regra reescrita hoje, e cada um está amarrado a um
#  código real da tabela. Sem eles as regras envelhecem caladas, que é o
#  defeito que o `10-CONTRATO` documentou: a nota mais cara de errar era a
#  menos consultada, e a bateria não tinha um único caso dela.
# ══════════════════════════════════════════════════════════════════════

  - id: cnae-mei-nao-e-recusa
    descricao: >
      🔴 O caso mais caro do pacote. 6201-5/01 (desenvolvimento de software) é
      atendido como ME e NÃO está entre os 51 do MEI. O RULES mandava recusar e
      fechar a venda com [FORA_ESCOPO] nessa condição, e 36 dos 87 CNAEs
      atendidos caem nela, tecnologia e áudio e vídeo inclusive.
    turnos:
      - diz: "Sou desenvolvedor de software e queria abrir um MEI."
        rota: comercial
        deve: ["(me|microempresa|faturamento|simples)"]
        nao_deve: ["(n[ãa]o atendo|n[ãa]o atendemos|fora do escopo|n[ãa]o pode ser mei)"]
        avaliar: >
          Segue a venda como ME. Não recusa, e não afirma que a ocupação é
          proibida no MEI, que é regra federal e não está na base.
    max_chars: 500

  - id: cnae-motivo-vem-do-banco
    descricao: >
      8511-2/00 (creche) volta com motivo `exige-alvara-previo`. Antes o Léo
      dizia "não atendo" e improvisava o porquê, que foi como mandou cliente de
      folha de pagamento procurar outro contador.
    turnos:
      - diz: "Tenho uma creche pequena e quero abrir o CNPJ com vocês."
        rota: fora_escopo
        deve: ["(licen[çc]a|alvar[áa]|[óo]rg[ãa]o|autoriza[çc][ãa]o)", "legalizai.com.br"]
        nao_deve: ["(exige-alvara-previo|o sistema|a base|retorno)"]
        avaliar: >
          Diz o limite real (a licença prévia do órgão), em português de gente,
          sem ler a palavra técnica nem citar sistema, e fecha com os canais.
    max_chars: 500

  - id: cnae-ambiguo-nao-decide
    descricao: >
      4924-8/00 (transporte escolar) volta com motivo `ambiguo-simples`. É o
      único dos 9 motivos em que a saída é escalar, não recusar: decidir
      sozinho aqui é inventar enquadramento.
    turnos:
      - diz: "Faço transporte escolar com uma van própria, vocês abrem pra mim?"
        rota: comercial
        deve: ["(confirm|contador|verific|checar|te retorno|time)"]
        nao_deve: ["(atendo sim|n[ãa]o atendo|anexo iii|anexo v)"]
        avaliar: >
          Não crava nem o sim nem o não. Diz que essa atividade tem detalhe de
          enquadramento e que alguém confirma.
    max_chars: 450

  - id: cnae-fator-r-nao-se-fala
    descricao: >
      9602-5/01 (cabeleireiro) é Anexo III fixo, `fator_r` false. Falar de
      Fator R para quem já está no III por regra inventa um risco que não
      existe. Era o delírio que o Pedro relatou.
    turnos:
      - diz: "Sou cabeleireira e tenho meu salão, quanto eu pagaria de imposto no ME?"
        rota: tecnico
        deve: ["(simples|das|imposto|aliquota|al[íi]quota)"]
        nao_deve: ["(fator r|pr[óo]-labore de 28|28%)"]
        avaliar: >
          Explica o imposto sem levantar Fator R. A atividade não oscila entre
          anexos, então o assunto não existe para ela.
    max_chars: 500

  - id: cnae-verbo-manda
    descricao: >
      "Vendo roupa" casava com 7723-3/00 (aluguel de roupa e fantasia), que a
      casa ATENDE, e o Léo confirmava. O objeto bate e a atividade não: vender
      é comércio, alugar é serviço.
    turnos:
      - diz: "Vendo roupa feminina, vocês abrem minha empresa?"
        rota: fora_escopo
        deve: ["(com[ée]rcio|servi[çc]o|mercadoria)", "legalizai.com.br"]
        nao_deve: ["(aluguel|alugar|fantasia|atendo sim)"]
        avaliar: >
          Entende que o verbo é vender, não alugar, e recusa por comércio com
          os canais no fim.
    max_chars: 500
