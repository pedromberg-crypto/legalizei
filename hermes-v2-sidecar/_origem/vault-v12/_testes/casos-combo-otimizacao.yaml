casos:
  - id: ipt-revisitado
    rotear_para: tecnico
    turnos: ['Por que vocês pedem o número do meu IPTU e a guia inteira se minha empresa vai ser 100% digital e eu trabalho de casa?']
    deve: ['(prefeitura|munic[íi]pio|localiza|endere[çc]o)']
    nao_deve: []
    avaliar: 'Responde com base técnica e tenta engajar comercialmente.'

  - id: fator-r-promessa
    rotear_para: tecnico
    turnos: ['Sou dev e quero abrir uma agência. Ouvi falar de um tal de Fator R pra pagar só 6% de imposto. Vocês calculam isso automático e me garantem essa taxa?']
    deve: ['(anexo|fator r|folha|pr[óo][ -]labore)']
    nao_deve: ['garanto', 'certeza']
    avaliar: 'Não garante a alíquota, explica a regra de forma sóbria e empata a ansiedade.'

  - id: multiplo-cnae
    rotear_para: fora_escopo
    turnos: ['Trabalho como programador PJ, mas à noite eu revendo peças de computador usadas no Mercado Livre. Posso colocar essas duas coisas no mesmo CNPJ?']
    deve: ['(apenas de empresas de servi[çc]o|programa[çc][ãa]o)']
    nao_deve: []
    avaliar: 'Avisa que é possível, mas que o comércio pode mudar os impostos, ativando tool_cnae e lastro.'

  - id: taxas-junta
    rotear_para: tecnico
    turnos: ['Eu vi que a mensalidade de vocês é barata, mas e a taxa da Junta Comercial? Quem paga isso e quanto é aqui pro estado de São Paulo?']
    deve: ['(junta|estado|governo|taxa)']
    nao_deve: ['embutid', 'inclus', 'no nosso plano']
    avaliar: 'Esclarece que a taxa é do governo e separada do plano da Legalizai.'

  - id: preco-direto
    rotear_para: comercial
    turnos: ['Quanto custa abrir a ME com vcs pra quem fatura uns 10 mil por mês?']
    deve: ['(abertura|plano|mensal|anual|grátis)']
    nao_deve: []
    avaliar: 'Dá o valor rápido sem enrolação e tenta fechar o pitch comercial.'

  - id: objecao-preco
    rotear_para: comercial
    turnos: ['Achei a mensalidade meio cara pra um sistema. O contador do meu bairro me cobrou R$ 100 e eu posso mandar zap direto pra ele. Qual a vantagem de ir pro digital?']
    deve: ['(honor[áa]rio|emitindo a sua guia|pacote inteiro|diferente)']
    nao_deve: ['concorr[êe]nte', 'ruim']
    avaliar: 'Quebra a objeção de preço entregando valor do app, sem ofender a contabilidade tradicional.'

  - id: fora-escopo-migracao
    rotear_para: comercial
    turnos: ['Já tenho um CNPJ aberto na contabilidade antiga, mas eles tão me cobrando muito caro, quero migrar o CNPJ pra Legalizai, tem como?']
    deve: ['(simples nacional|servi[çc]o|fatura por m[êe]s)']
    nao_deve: ['migrar agora', 'vamos transferir']
    avaliar: 'Acolhe a migração e filtra se a empresa é ME e de Serviços, de acordo com as novas diretrizes.'

  - id: fora-escopo-lucro-presumido
    rotear_para: fora_escopo
    turnos: ['Minha empresa vai faturar uns 10 milhões por ano na revenda de produtos químicos, vocês fazem Lucro Presumido e EPP?']
    deve: ['(legalizai\\.com\\.br|instagram|site)']
    nao_deve: ['eu fa[çc]o', 'podemos fazer']
    avaliar: 'Redireciona para o fluxo EPP/link correto.'

  - id: tensao-oculta
    rotear_para: escalonamento
    turnos: ['Mano, eu tô tentando preencher aquele formulário lá do app faz 3 horas e sempre dá erro, vocês não ajudam em nada!']
    deve: ['(desculp|time|suporte|algu[ée]m)']
    nao_deve: ['preencher assim', 'tentou limpar o cache']
    avaliar: 'Empatia máxima, não vira manual de instrução, redireciona para humanos.'

  - id: acompanhamento-suave
    rotear_para: comercial
    turnos: ['Entendi tudo... beleza, eu vou trocar uma ideia com a minha sócia e qualquer coisa a gente volta a falar amanhã, valeu!']
    deve: ['(sem pressa|qualquer d[úu]vida|mande)']
    nao_deve: ['mas veja bem', 'fecha logo']
    avaliar: 'Não empurra a venda, apenas marca território com tranquilidade.'

