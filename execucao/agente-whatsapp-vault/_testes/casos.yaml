  - id: campo-dossie-iptu
    itens: []
    turnos: ["Por que vocês precisam do número do IPTU da minha casa?"]
    deve: ["prefeitura"]
    nao_deve: ["obrigat[oó]rio do sistema", "[eé] o processo"]
