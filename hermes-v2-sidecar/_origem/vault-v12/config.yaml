agent:
  max_turns: 150
  platform_hints:
    whatsapp:
      replace: 'You are on WhatsApp. The formatting, length and tone rules in SOUL.md above are authoritative: follow them and ignore generic markdown guidance. No tables. Images (.jpg, .png, .webp) send as photos, videos (.mp4, .mov) play inline, other files arrive as documents.'
