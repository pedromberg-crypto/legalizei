# ── Security ──────────────────────────────────────────────────────────
# Secret <REDIGIDO>
# token<REDIGIDO>
# responses before the model or user ever sees them. Set redact_secret<REDIGIDO>
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* key<REDIGIDO>
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secret<REDIGIDO>
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY<REDIGIDO>
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY<REDIGIDO>
#   kimi-coding  (KIMI_API_KEY<REDIGIDO>
#   kimi-coding-cn (KIMI_CN_API_KEY<REDIGIDO>
#   minimax      (MINIMAX_API_KEY<REDIGIDO>
#   minimax-cn   (MINIMAX_CN_API_KEY<REDIGIDO>
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key<REDIGIDO>
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4
