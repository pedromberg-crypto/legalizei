  <script>
    // Logo estático + conteúdo em cascata suave (a marca já animou na splash coral).

    // paperplane loading (respeita reduced-motion)
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (window.lottie && window.PAPERPLANE) {
      const anim = lottie.loadAnimation({
        container: document.getElementById('paperplane'),
        renderer: 'svg',
        loop: true,
        autoplay: false,                 // driver manual (independe de requestAnimationFrame)
        animationData: window.PAPERPLANE,
      });

      // Alguns visualizadores rodam o tab offscreen -> rAF congela o Lottie no frame 0.
      // Driver manual via setInterval mantém o avião visível e em loop mesmo assim.
      anim.addEventListener('DOMLoaded', () => {
        const total = Math.floor(anim.totalFrames);
        if (reduce) { anim.goToAndStop(Math.floor(total / 2), true); return; }
        let f = 0;
        setInterval(() => {
          f = (f + 1) % total;
          anim.goToAndStop(f, true);
        }, 1000 / 50);                   // 50fps (fr do arquivo); degrada sozinho se o tab ocultar
      });
    }
  </script>
