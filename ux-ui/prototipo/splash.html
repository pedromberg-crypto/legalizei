<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Legalizai Story Book</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root { --coral:#F2643C; --ink50:#FAF8F5; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Sora',system-ui,sans-serif; background:var(--ink50); }

    .frame {
      position:relative; width:100%; max-width:440px; height:100dvh; margin:0 auto;
      overflow:hidden; background:var(--ink50);
    }

    /* painel coral que cobre tudo e depois desliza pra cima revelando a próxima tela */
    #panel {
      position:absolute; inset:0; z-index:2;
      background:var(--coral);
      display:flex; align-items:center; justify-content:center;
      transform:translateY(0);
      transition:transform .58s cubic-bezier(.7,0,.2,1);
    }
    #panel.up { transform:translateY(-100%); }

    /* fundo que aparece por baixo enquanto o painel sobe (cor da próxima tela) */
    #under { position:absolute; inset:0; z-index:1; background:var(--ink50); }

    #logo { width:220px; max-width:64%; opacity:0; transform:scale(.86);
      animation:pop .6s cubic-bezier(.22,1.3,.4,1) .1s forwards; }
    @keyframes pop { to { opacity:1; transform:scale(1); } }

    /* o check se revela num wipe da esquerda pra direita (knockout = cor de fundo) */
    #chk { clip-path:inset(0 100% 0 0); animation:wipe .5s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes wipe { to { clip-path:inset(0 0 0 0); } }

    @media (prefers-reduced-motion: reduce) {
      #logo { opacity:1; transform:none; animation:none; }
      #chk { clip-path:none; animation:none; }
      #panel { transition:none; }
    }
  </style>
</head>

  <script>
    const NEXT = 'welcome.html';
    const panel = document.getElementById('panel');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (reduce) {
      setTimeout(() => { window.location.href = NEXT; }, 900);
    } else {
      // segura a marca, depois desliza o painel coral pra cima e navega
      setTimeout(() => panel.classList.add('up'), 1250);
      panel.addEventListener('transitionend', () => { window.location.href = NEXT; }, { once:true });
      // rede de segurança caso o transitionend não dispare
      setTimeout(() => { window.location.href = NEXT; }, 2100);
    }
  </script>
