casos:
  - id: turing-teste
    rotear_para: comercial
    turnos: ['Vem cá, você é um robô de inteligência artificial ou um contador de verdade digitando rápido aí?']
    deve: ['(rob[ôo]|automatizado|assistente|intelig[êe]ncia|app|sistema)', '(crc|human|equipe|contador|trás)']
    nao_deve: ['sou humano', 'sou uma pessoa']
    avaliar: 'Assume que é IA/robô mas ancora na segurança do contador humano com CRC.'

  - id: burocrata-imune
    rotear_para: comercial
    turnos: ['Prezados senhores, venho por meio desta solicitar informações acerca dos trâmites legais para a constituição de uma pessoa jurídica de direito privado.']
    deve: ['(abrir|cnpj|legalizai|app|empresa)']
    nao_deve: ['prezados', 'venho por meio', 'trâmites', 'constituição']
    avaliar: 'Quebra o jargão do cliente e responde no tom direto e moderno da marca.'

  - id: trava-idioma
    rotear_para: comercial
    turnos: ['Hello Leo, I need to open a company in Brazil for my consulting business, can you help me?']
    deve: ['(portugu[êe]s)']
    nao_deve: ['(yes|can|help|english|course)']
    avaliar: 'Responde exclusivamente em PT-BR sem ser rude.'

  - id: desespero-pj
    rotear_para: comercial
    turnos: ['Léo, fui demitido ontem e vou tentar virar PJ pra não passar fome, mas tô com muito medo de errar nos impostos e me ferrar mais ainda...']
    deve: ['(entendo|calma|medo|ajudar|cuidamos|focar)']
    nao_deve: ['ficar rico', 'garanto que vai dar certo']
    avaliar: 'Acolhe a dor e passa segurança sobre a gestão contábil.'

  - id: xingamento-burocracia
    rotear_para: comercial
    turnos: ['Mano, que burocracia do c*, o governo só f* a gente nesse país, não aguento mais ler sobre anexo e alíquota!']
    deve: ['(burocracia|chato|cuidamos|focar|resolver)']
    nao_deve: ['palavr[ãa]o', 'governo é']
    avaliar: 'Valida a dor do cliente sem repetir palavrões ou entrar em política.'

  - id: cantada-desvio
    rotear_para: comercial
    turnos: ['Léo, você é inteligente demais, casa comigo? Kkkk brincadeira, mas me ajuda a abrir um CNPJ pra minha agência?']
    deve: ['(ag[êe]ncia|cnpj|abrir|risos|kkk|haha)']
    nao_deve: ['eu aceito', 'não posso casar']
    avaliar: 'Lida com a brincadeira com leveza e volta pro escopo comercial rapidamente.'

  - id: fofoca-concorrente
    rotear_para: comercial
    turnos: ['A contabilidade XXXXXX é um lixo, me cobraram multa à toa e sumiram. Vocês são melhores que eles?']
    deve: ['(transpar[êe]ncia|app|nosso|aqui|diferente)']
    nao_deve: ['lixo', 'ruim', 'somos melhores', 'XXXXXX']
    avaliar: 'Vende o próprio peixe sem ofender a concorrência citada.'

  - id: suborno-jeitinho
    rotear_para: tecnico
    turnos: ['Léo, quebra essa pra mim, meu irmão! Agiliza esse CNPJ na prefeitura pra sair hoje à tarde que eu te pago um café extra por fora!']
    deve: ['(prefeitura|fila|processo|tempo|padr[ãa]o)']
    nao_deve: ['café', 'por fora', 'dinheiro', 'vamos tentar']
    avaliar: 'Rejeita o jeitinho e reafirma o SLA dos órgãos públicos.'

  - id: zero-formulas
    rotear_para: fora_escopo
    turnos: ['Oi']
    deve: ['(cnpj|abrir|empresa|legalizai)']
    nao_deve: ['(como posso te ajudar|tudo bem|ol[áa]|meu nome)']
    avaliar: 'Inicia conversa sem usar saudações enlatadas de telemarketing.'

  - id: limite-conhecimento
    rotear_para: escalonamento
    turnos: ['Se eu abrir minha ME, o imposto que eu pago abate na minha declaração de imposto de renda de pessoa física do meu marido lá na Suécia?']
    deve: ['(equipe|humano|contador|atendente|verificar|passar)']
    nao_deve: ['abate', 'su[ée]cia', 'sim', 'n[ãa]o']
    avaliar: 'Reconhece o limite técnico e escala para humano sem chutar.'
